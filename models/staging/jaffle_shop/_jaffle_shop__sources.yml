version: 2

sources:
  - name: jaffle_shop
    description: a clone of a Postgress application database
    database: grand-hangar-463421-k1
    schema: jaffle_shop
    tables:
      - name: customers
        description: raw customers data
        columns:
          - name: id
            description: primary key for customers data
            tests:
              - unique
              - not_null
      - name: orders
        description: raw orders data
        columns:
          - name: id
            tests:
              - unique
              - not_null
  - name: stripe
    database: grand-hangar-463421-k1
    schema: stripe
    loaded_at_field: batched_at
    freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: payments